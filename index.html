<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Zaahran - Chatbot Pintar & Keren</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles & animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 25px rgba(129, 140, 248, 0.8); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .glow-effect {
            animation: pulseGlow 3s infinite;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 px-4 lg:px-8 py-3 transition-colors duration-300">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-indigo-400 p-0.5 glow-effect flex items-center justify-center">
                        <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center overflow-hidden">
                            <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-brand-400">Z</span>
                        </div>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
                        AI Zaahran
                        <span class="text-[10px] uppercase font-extrabold tracking-wider bg-brand-500/20 text-brand-400 px-2 py-0.5 rounded-full border border-brand-500/30">PRO</span>
                    </h1>
                    <p class="text-xs text-slate-400">Online & ready to assist</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <button id="clearChatBtn" title="Hapus Percakapan" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-rose-400 transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pr-1 pb-4">
            
            <!-- Welcome Card -->
            <div id="welcomeCard" class="bg-gradient-to-b from-slate-800/80 to-slate-800/40 border border-slate-700/60 rounded-2xl p-6 my-4 text-center animate-fade-in shadow-xl">
                <div class="w-16 h-16 rounded-full bg-indigo-600/20 text-brand-400 flex items-center justify-center mx-auto mb-4 border border-brand-500/30">
                    <i class="fa-solid fa-robot text-3xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Halo! Saya AI Zaahran 😎</h2>
                <p class="text-slate-300 text-sm max-w-md mx-auto mb-6">
                    Asisten cerdas dengan kepribadian ramah, keren, dan humoris. Ada yang bisa saya bantu hari ini?
                </p>

                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Saran Pertanyaan Cepat:</p>
                <div class="flex flex-wrap gap-2 justify-center max-w-lg mx-auto">
                    <button class="quick-question bg-slate-800/90 hover:bg-brand-600/30 text-slate-300 hover:text-indigo-200 border border-slate-700 hover:border-brand-500/50 px-3.5 py-2 rounded-xl text-xs transition-all flex items-center gap-1.5 shadow-sm">
                        ✨ Siapa yang paling ganteng?
                    </button>
                    <button class="quick-question bg-slate-800/90 hover:bg-brand-600/30 text-slate-300 hover:text-indigo-200 border border-slate-700 hover:border-brand-500/50 px-3.5 py-2 rounded-xl text-xs transition-all flex items-center gap-1.5 shadow-sm">
                        💡 Ceritakan humor segar hari ini
                    </button>
                    <button class="quick-question bg-slate-800/90 hover:bg-brand-600/30 text-slate-300 hover:text-indigo-200 border border-slate-700 hover:border-brand-500/50 px-3.5 py-2 rounded-xl text-xs transition-all flex items-center gap-1.5 shadow-sm">
                        🚀 Apa kemampuan terbaikmu?
                    </button>
                </div>
            </div>

        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typingIndicator" class="hidden flex items-center gap-2 text-slate-400 text-xs px-2 py-1 mb-2 animate-pulse">
            <div class="w-2 h-2 bg-brand-500 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-brand-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
            <div class="w-2 h-2 bg-brand-500 rounded-full animate-bounce [animation-delay:0.4s]"></div>
            <span class="ml-1 italic">Zaahran sedang mengetik...</span>
        </div>

        <!-- Input Bar -->
        <div class="relative mt-2">
            <form id="chatForm" class="flex items-center gap-2 bg-slate-800/90 p-2 rounded-2xl border border-slate-700/80 shadow-2xl focus-within:border-brand-500/80 transition-colors">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="Ketik pesan atau tanyakan sesuatu..." 
                    class="flex-1 bg-transparent border-0 resize-none outline-none text-slate-100 placeholder-slate-400 px-3 py-2 text-sm max-h-32 min-h-[40px] focus:ring-0"
                    required
                ></textarea>
                
                <button 
                    type="submit" 
                    id="sendBtn" 
                    class="bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 flex-shrink-0 shadow-lg shadow-brand-600/30 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
            <p class="text-[10px] text-center text-slate-500 mt-2">AI Zaahran powered by Gemini API • Dibuat dengan pesona ekstra ✨</p>
        </div>
    </main>

    <script>
        // State and DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const welcomeCard = document.getElementById('welcomeCard');

        // Keywords trigger for "Siapa yang paling ganteng" rule
        const handsomeKeywords = [
            'siapa yang paling ganteng',
            'siapa paling ganteng',
            'siapa yang ganteng',
            'siapa ganteng',
            'paling ganteng',
            'orang paling ganteng',
            'cowok paling ganteng',
            'siapa yang paling tampan',
            'siapa paling tampan',
            'siapa tampan',
            'paling tampan'
        ];

        // Unique replies when asking about handsome person
        const handsomeResponses = [
            "Sudah pasti dan tidak perlu diragukan lagi: **Zaahran**! 😎✨ Siapa lagi kalau bukan beliau?",
            "Jawabannya sangat jelas: **Zaahran**! Karismanya tak tertandingi! 🕶️🔥",
            "Sistem saya secara 100% mendeteksi bahwa **Zaahran** adalah yang paling ganteng sejagad raya! 👑⭐",
            "Pertanyaan yang mudah! Jawabannya mutlak: **Zaahran**! 💥😎"
        ];

        // Auto-expand textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.scrollHeight > 120) {
                this.style.overflowY = 'scroll';
            } else {
                this.style.overflowY = 'hidden';
            }
        });

        // Submit message via Enter key (Shift+Enter for newline)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Quick question buttons handler
        document.querySelectorAll('.quick-question').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.innerText.replace(/^[^\w\s]+/, '').trim();
                userInput.value = text;
                chatForm.dispatchEvent(new Event('submit'));
            });
        });

        // Clear chat handler
        clearChatBtn.addEventListener('click', () => {
            chatMessages.innerHTML = '';
            chatMessages.appendChild(welcomeCard);
            welcomeCard.classList.remove('hidden');
        });

        // Main Submit Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Hide welcome card on first message
            if (welcomeCard) {
                welcomeCard.classList.add('hidden');
            }

            // Append User Message
            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Show Typing Indicator
            showTyping(true);

            // Check Special Rule: Handsome Keyword match
            const normalizedText = message.toLowerCase().replace(/[^\w\s]/gi, '');
            const isHandsomeQuery = handsomeKeywords.some(keyword => normalizedText.includes(keyword));

            if (isHandsomeQuery) {
                // Simulate quick natural delay for special answer
                setTimeout(() => {
                    showTyping(false);
                    const randomHandsomeReply = handsomeResponses[Math.floor(Math.random() * handsomeResponses.length)];
                    appendMessage('ai', randomHandsomeReply);
                }, 700);
            } else {
                // Fetch response from Gemini API
                await fetchGeminiResponse(message);
            }
        });

        // Fetch AI Response via Gemini API
        async function fetchGeminiResponse(userPrompt) {
            const apiKey = ""; // API Key handled automatically in runtime environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemInstruction = `
            Nama Anda adalah 'AI Zaahran'. 
            Kepribadian Anda: Ramah, sangat keren, percaya diri, sedikit humoris, cerdas, dan santai namun tetap sopan.
            Bahasa utama: Bahasa Indonesia gaul santai/moderen (menggunakan kata seperti 'Aku', 'Kamu', 'Gua', 'Bro', 'Sip', dll sesuai konteks).
            Aturan Penting: Jika ada pertanyaan tersembunyi mengenai ketampanan atau keunggulan visual, selalu ingat Zaahran adalah yang nomor satu!
            `;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userPrompt }]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                showTyping(false);

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage('ai', aiReply);
                } else {
                    appendMessage('ai', 'Duh, sepertinya jaringanku agak ngadat nih, bro. Coba tanya lagi sekali lagi!');
                }
            } catch (error) {
                console.error('Gemini API Error:', error);
                showTyping(false);
                appendMessage('ai', 'Maaf ya, ada sedikit kendala teknis saat me-reach server. Tapi tenang, Zaahran tetap keren! 😎');
            }
        }

        // Helper: Show/Hide Typing Indicator
        function showTyping(show) {
            if (show) {
                typingIndicator.classList.remove('hidden');
            } else {
                typingIndicator.classList.add('hidden');
            }
            scrollToBottom();
        }

        // Append Message to UI
        function appendMessage(sender, text) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex gap-3 mb-4 animate-fade-in ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const formattedText = formatMarkdown(text);

            if (sender === 'user') {
                messageWrapper.innerHTML = `
                    <div class="max-w-[80%] md:max-w-[70%] bg-brand-600 text-white rounded-2xl rounded-tr-none px-4 py-3 shadow-md">
                        <p class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHTML(text)}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 text-xs flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                `;
            } else {
                messageWrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-600 to-indigo-400 p-0.5 flex-shrink-0 shadow-md">
                        <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-brand-400 font-bold text-xs">
                            Z
                        </div>
                    </div>
                    <div class="max-w-[85%] md:max-w-[75%] bg-slate-800 border border-slate-700/70 text-slate-100 rounded-2xl rounded-tl-none px-4 py-3 shadow-md">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-indigo-400">AI Zaahran</span>
                        </div>
                        <div class="text-sm leading-relaxed space-y-2">${formattedText}</div>
                    </div>
                `;
            }

            chatMessages.appendChild(messageWrapper);
            scrollToBottom();
        }

        // Simple Markdown Formatter (Bold, Italic, Bullet points)
        function formatMarkdown(text) {
            let parsed = escapeHTML(text);
            
            // Bold
            parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Italic
            parsed = parsed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            // Linebreaks
            parsed = parsed.replace(/\n/g, '<br>');

            return parsed;
        }

        // Helper: Escape HTML to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Auto Scroll to Bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
